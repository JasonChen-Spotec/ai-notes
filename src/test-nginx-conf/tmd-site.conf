# tmd-pc-web Nginx 配置
# 关键改动:
#   1. upstream 增加 max_fails / fail_timeout, 后端重启时自动摘流
#   2. upstream 增加 keepalive 长连接池, 减少 TCP 握手开销
#   3. proxy_next_upstream 在后端 5xx/超时时自动切到另一台
#   4. 健康检查依赖 /api/health (deploy.sh 使用)

upstream client-site {
  server localhost:9030 max_fails=2 fail_timeout=30s;
  server localhost:9080 max_fails=2 fail_timeout=30s;

  # 长连接池: 减少与后端的 TCP 握手, 显著提升 QPS
  keepalive 32;
  keepalive_timeout 60s;
  keepalive_requests 1000;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# crm 服务
server {
  server_name crm.spotecreadonly129.net crm.spotec129.net.au crm.spotec129v2.net crm.spotec129.net;
  listen 80;

  location / {
    proxy_intercept_errors on;
    proxy_pass http://client-site;

    # 后端 5xx / 超时 / 连接错误时自动切到下一台 upstream
    # 实现真正的无缝发布: 即使一个后端在 reload 期间短暂不可用, 用户也无感知
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 10s;

    proxy_http_version 1.1;
    # 配合 upstream keepalive 必须清空 Connection 头
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Client-IP $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_set_header Upgrade $http_upgrade;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  # 健康检查接口直通后端 (用于 deploy.sh 的健康探测)
  # 单独 location 便于 access_log 关闭, 不污染业务日志
  location = /api/health {
    access_log off;
    proxy_pass http://client-site;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
  }

  location = /robots.txt {
    default_type text/plain;

    if ($host ~* ^crm\.ecmarkets\.(sc|com|com\.au|co\.nz|mu)$) {
      return 200 "User-agent: *\nAllow: /\n";
    }

    return 200 "User-agent: *\nDisallow: /\n";
  }

  error_page 502 503 504 /50x.html;
  location = /50x.html {
    root /etc/nginx/error_page;
  }
}

# 代理服务
server {
  listen 80;
  server_name ib.spotecreadonly129.net ib.spotec129v2.net ib.spotec129.net ib.spotec129.net.au sales.spotec129.net sales.spotec129v2.net sales.spotecreadonly129.net;
  index index.html index.htm default.php default.htm default.html;
  root /data/fee/application/tmd-IB-web/current;

  location ^~ /PL/ {
    proxy_pass http://192.168.0.129:31000/api/client/pm/;
    proxy_set_header X-Client-IP $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $http_host;
    proxy_set_header instanceVersion b;
    proxy_connect_timeout 60;
    proxy_read_timeout 600;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# 管理端
server {
  listen 80;
  server_name admin.spotec129v2.net admin.spotec129.net admin.spotec129.net.au;
  index  index.html index.htm default.php default.htm default.html;
  root /data/fee/application/tmd-admin/current;
  try_files $uri $uri/ /index.html;
}

# 官网
server {
  listen 80;
  server_name www.spotec129.net;

  location / {
    proxy_intercept_errors on;
    proxy_pass http://192.168.0.129:9010;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Client-IP $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  error_page 502 503 504 /50x.html;
  location = /50x.html {
    root /etc/nginx/error_page;
  }
}

# 文件服务
server {
  listen 80;
  server_name file.spotecreadonly129.net file.spotec129.net file.spotec129v2.net;
  location / {
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host 192.168.0.15:9000;

    proxy_connect_timeout 300;
    # Default is HTTP/1, keepalive is only enabled in HTTP/1.1
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    chunked_transfer_encoding off;

    proxy_pass http://192.168.0.15:9000;
  }
}

# 私域信号分享链接
server {
  listen 80;
  server_name i.spotec129.net i.spotec129v2.net;

  location ~ /api/client/ {
    proxy_pass http://127.0.0.1:31000;
    proxy_set_header X-Client-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $http_host;
    # 从当前nginx过的流量都携带B版本,流量仅在B路线消费
    proxy_set_header instanceVersion b;

    proxy_connect_timeout 60;
    proxy_read_timeout 600;
  }
}

# 落地页
server {
  listen 80;
  server_name r.spotec129.net;

  root /data/fee/application/tmd-landing-page/current;
  index index.html;

  try_files $uri $uri/ /index.html;

  # 清除潜在旧头
  add_header Content-Security-Policy "" always;
  add_header Content-Security-Policy-Report-Only "" always;
  add_header X-Frame-Options "" always;

  # 正确允许 iframe
  add_header Content-Security-Policy "frame-ancestors http: https:" always;
}

# webview
server {
  server_name m.spotec129.net;
  listen 80;

  # 引入统一的 API 和 WebSocket 路由
  include /etc/nginx/snippets/shared-api-locations.inc;

  location / {
    proxy_intercept_errors on;
    proxy_pass http://localhost:6060;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Client-IP $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location = /robots.txt {
    default_type text/plain;

    if ($host ~* ^crm\.ecmarkets\.(sc|com|com\.au|co\.nz|mu)$) {
      return 200 "User-agent: *\nAllow: /\n";
    }

    return 200 "User-agent: *\nDisallow: /\n";
  }

  error_page 502 503 504 /50x.html;
  location = /50x.html {
    root /etc/nginx/error_page;
  }

  access_log /var/log/nginx/mobile-web.log combined;
  error_log /var/log/nginx/mobile-web-error.log;
}
